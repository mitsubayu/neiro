# neiro CI — build and unit tests on a hosted macOS agent.
#
# The agent has no signing certificates and no TCC grants, so signing is
# disabled and the app never starts its audio engine during tests (see the
# XCTest guard in AppDelegate). The Release artifact is an unsigned .app for
# inspection, not for distribution.

trigger:
  branches:
    include:
      - main

# Validate branches before they reach main.
pr:
  branches:
    include:
      - main

pool:
  vmImage: macOS-latest

jobs:
  - job: build_and_test
    displayName: Build & test
    timeoutInMinutes: 30
    steps:
      - script: |
          sw_vers
          xcodebuild -version
          xcodegen --version || true
        displayName: Toolchain info

      - script: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify
        displayName: Install tools

      # The .xcodeproj is generated, never committed, so this is also a check
      # that project.yml is valid.
      - script: xcodegen generate
        displayName: Generate Xcode project

      - script: |
          set -euo pipefail
          mkdir -p build/reports
          xcodebuild \
            -project neiro.xcodeproj \
            -scheme neiro \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath build/reports/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test \
            | xcbeautify --report junit --report-path build/reports
        displayName: Unit tests

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: build/reports/junit.xml
          failTaskOnFailedTests: true
          testRunTitle: neiro unit tests

      # The result bundle carries the failure details worth digging into.
      - task: PublishBuildArtifacts@1
        displayName: Publish test result bundle (on failure)
        condition: failed()
        inputs:
          PathtoPublish: build/reports/tests.xcresult
          ArtifactName: test-results

      - script: |
          set -euo pipefail
          xcodebuild \
            -project neiro.xcodeproj \
            -scheme neiro \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcbeautify
        displayName: Release build

      - script: |
          set -euo pipefail
          cd build/Build/Products/Release
          zip -qr "$(Build.ArtifactStagingDirectory)/neiro-unsigned.zip" neiro.app
        displayName: Package app

      - task: PublishBuildArtifacts@1
        displayName: Publish app
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)
          ArtifactName: neiro-app
