# Build and test on every push and pull request. The runner has no signing
# certificate and no TCC grants, so the app is built unsigned and never starts
# its audio engine during tests (AppDelegate skips startup under XCTest).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: scripts/ci.sh

      - name: Keep the test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports
