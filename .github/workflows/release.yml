# Publishes a Release build when a v* tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The zip is ad-hoc signed, not notarized — signing for real needs a Developer
# ID certificate from the Apple Developer Program. Ad-hoc is not a nicety:
# an arm64 binary with no signature at all will not launch, so "unsigned"
# releases still have to carry one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          scripts/bootstrap.sh
          xcodebuild \
            -project neiro.xcodeproj \
            -scheme neiro \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            build

      - name: Sign ad-hoc and package
        run: |
          APP=build/Build/Products/Release/neiro.app
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --verbose "$APP"
          # ditto, not zip: it is the only archiver that preserves the bundle's
          # symlinks and extended attributes intact.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "neiro-${GITHUB_REF_NAME}.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "neiro-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Unpack the zip and move `neiro.app` to `/Applications`.

          The build is ad-hoc signed and not notarized, so the first launch is
          blocked: open **System Settings → Privacy & Security**, scroll to
          Security and press **Open Anyway**.

          Then grant **Screen & System Audio Recording** (how the process tap
          reads Music's audio) and **Automation → Music** (pausing around a
          rate switch). macOS asks for the audio permission again after each
          update, because an ad-hoc signature changes with every build.
          NOTES
