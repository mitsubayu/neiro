name: neiro
options:
  bundleIdPrefix: com.mitsuba
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7N7LUCUW5K
    ENABLE_HARDENED_RUNTIME: NO
targets:
  neiro:
    type: application
    platform: macOS
    sources:
      - neiro
    info:
      path: neiro/Info.plist
      properties:
        CFBundleDisplayName: neiro
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 mitsubayu
        LSUIElement: true
        NSAudioCaptureUsageDescription: neiro captures Music.app's audio output to apply the parametric EQ you configure.
        NSAppleEventsUsageDescription: neiro briefly pauses and resumes Music.app so sample-rate switches happen without an audible glitch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsuba.neiro
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - neiroTests
  neiroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - neiroTests
    dependencies:
      - target: neiro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/neiro.app/Contents/MacOS/neiro
        BUNDLE_LOADER: $(TEST_HOST)
